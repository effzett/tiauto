name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: Toleranzintervall-Rechner-macOS
            ext: .app
          - os: windows-latest
            artifact: Toleranzintervall-Rechner-Windows
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Build with PyInstaller
        run: python build.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../Toleranzintervall-Rechner-macOS.zip Toleranzintervall-Rechner.app

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Toleranzintervall-Rechner.exe -DestinationPath Toleranzintervall-Rechner-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Toleranzintervall-Rechner-macOS/Toleranzintervall-Rechner-macOS.zip
            Toleranzintervall-Rechner-Windows/Toleranzintervall-Rechner-Windows.zip
